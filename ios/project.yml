name: Spitify
options:
  bundleIdPrefix: com.calebtrueman
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  NostrSDK:
    url: https://github.com/nostrdevkit/nostr-sdk-swift.git
    exactVersion: 0.45.1
  TagLibSwift:
    url: https://github.com/jeonghi/TagLibSwift.git
    revision: a36e48f43a4cea1fd41baa0c90acdb6f35444800
settings:
  base:
    SWIFT_OBJC_INTEROP_MODE: objcxx
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.26"
    CURRENT_PROJECT_VERSION: "31"
    SPITIFY_BUNDLE_ID: "com.calebtrueman.spitify"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # Set this to CarPlay.entitlements only with a CarPlay-approved signing profile.
    SPITIFY_CARPLAY_ENTITLEMENTS: "Spitify/Widgets.entitlements"
    # Override with Spitify/Siri.entitlements for a Siri-enabled signing profile.
    SPITIFY_APP_ENTITLEMENTS: "$(SPITIFY_CARPLAY_ENTITLEMENTS)"
    CODE_SIGN_ENTITLEMENTS: "$(SPITIFY_APP_ENTITLEMENTS)"
targets:
  Spitify:
    type: application
    platform: iOS
    sources:
      - path: Spitify
      - path: WidgetShared
      - path: ../licenses
        buildPhase: resources
      - path: ../shared/themes
        type: folder
        buildPhase: resources
      - path: ../shared/icons/icon-catalog.json
        buildPhase: resources
    dependencies:
      - target: SpitifyWidgets
        embed: true
      - package: TagLibSwift
      - package: NostrSDK
        product: NostrSDK
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Spitify/Data/FileTagsBridge.h
        PRODUCT_BUNDLE_IDENTIFIER: "$(SPITIFY_BUNDLE_ID)"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "Vinyl_no_landlords Vinyl_skip_fees Vinyl_no_ads Vinyl_your_music Vinyl_green Vinyl_moon Vinyl_sun Vinyl_mountain Vinyl_ocean Vinyl_flower Vinyl_lightning Vinyl_cassette Vinyl_fire Vinyl_aurora Vinyl_rocket Vinyl_dino Vinyl_race Vinyl_butterfly Vinyl_unicorn Vinyl_cat Vinyl_robot Vinyl_rainbow Vinyl_soccer Vinyl_frog"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Spitify/Resources/Info.plist
        ENABLE_PREVIEWS: YES
  SpitifyWidgets:
    type: app-extension
    platform: iOS
    sources: [SpitifyWidgets, WidgetShared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(SPITIFY_BUNDLE_ID).widgets"
        INFOPLIST_FILE: SpitifyWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: "Spitify/Widgets.entitlements"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SPITIFY_WIDGET_EXTENSION"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  SpitifyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SpitifyTests
    dependencies:
      - target: Spitify
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  SpitifyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SpitifyUITests]
    dependencies:
      - target: Spitify
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Spitify
schemes:
  Spitify:
    build:
      targets:
        Spitify: all
        SpitifyTests: [test]
        SpitifyUITests: [test]
    test:
      targets: [SpitifyTests, SpitifyUITests]
