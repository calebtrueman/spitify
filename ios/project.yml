name: Spitify
options:
  bundleIdPrefix: com.calebtrueman
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  TagLibSwift:
    url: https://github.com/jeonghi/TagLibSwift.git
    revision: a36e48f43a4cea1fd41baa0c90acdb6f35444800
settings:
  base:
    SWIFT_OBJC_INTEROP_MODE: objcxx
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.8"
    CURRENT_PROJECT_VERSION: "9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    # Set this to CarPlay.entitlements only with a CarPlay-approved signing profile.
    SPITIFY_CARPLAY_ENTITLEMENTS: ""
    CODE_SIGN_ENTITLEMENTS: "$(SPITIFY_CARPLAY_ENTITLEMENTS)"
targets:
  Spitify:
    type: application
    platform: iOS
    sources:
      - path: Spitify
    dependencies:
      - package: TagLibSwift
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Spitify/Data/FileTagsBridge.h
        PRODUCT_BUNDLE_IDENTIFIER: com.calebtrueman.spitify
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Spitify/Resources/Info.plist
        ENABLE_PREVIEWS: YES
  SpitifyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SpitifyTests
    dependencies:
      - target: Spitify
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  SpitifyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SpitifyUITests]
    dependencies:
      - target: Spitify
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Spitify
schemes:
  Spitify:
    build:
      targets:
        Spitify: all
        SpitifyTests: [test]
        SpitifyUITests: [test]
    test:
      targets: [SpitifyTests, SpitifyUITests]
