name: iOS build

on:
  push:
    branches: [main]
    paths: ["ios/**", "shared/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: brew install xcodegen && cd ios && xcodegen generate
      - name: Unit tests
        run: |
          cd ios
          xcodebuild test -project Spitify.xcodeproj -scheme Spitify -only-testing:SpitifyTests \
            -destination 'platform=iOS Simulator,name=iPhone 17' -parallel-testing-enabled NO \
            -resultBundlePath build/SpitifyTests.xcresult -quiet
      - name: Keep test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iPhone-test-report
          path: ios/build/SpitifyTests.xcresult
          if-no-files-found: ignore
      - name: Build unsigned IPA
        run: |
          cd ios
          xcodebuild archive -project Spitify.xcodeproj -scheme Spitify -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Spitify.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -quiet
          mkdir -p build/ipa/Payload
          cp -R build/Spitify.xcarchive/Products/Applications/Spitify.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../Spitify.ipa Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: Spitify-unsigned-ipa
          path: ios/build/Spitify.ipa
      - name: Attach to release
        if: github.event_name == 'release'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          TAG="${{ github.event.release.tag_name }}"
          cp ios/build/Spitify.ipa "ios/build/Spitify-${TAG#v}-unsigned.ipa"
          gh release upload "$TAG" "ios/build/Spitify-${TAG#v}-unsigned.ipa" --clobber
      - name: Publish to SideStore source
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          V="${TAG#v}"
          git fetch origin main && git checkout main
          python3 scripts/update-sidestore-source.py "$V" "ios/build/Spitify-$V-unsigned.ipa" \
            "https://github.com/${{ github.repository }}/releases/download/$TAG/Spitify-$V-unsigned.ipa" \
            "$(gh release view "$TAG" --json body -q .body | head -c 1500)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios/sidestore-source.json
          git commit -m "SideStore source: $TAG" && git push origin main || echo "No changes"
        env: { GH_TOKEN: "${{ github.token }}" }
